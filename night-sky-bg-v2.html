document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ead3da60-80a0-478b-b445-423f928a951f\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; background: #050506; }\n  *, *::before, *::after { box-sizing: border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{ rootRef }}\" style=\"position: relative; width: 100%; height: 100vh; overflow: hidden; background: #050506;\">\n  <div id=\"starfield-layer\" data-parallax=\"starfield\" style=\"position: absolute; left: 0; top: 0; width: 100%; will-change: transform;\">\n    <canvas data-layer=\"static\" style=\"position: absolute; left: 0; top: 0; display: block;\"><\u002Fcanvas>\n    <canvas data-layer=\"twinkle\" style=\"position: absolute; left: 0; top: 0; display: block;\"><\u002Fcanvas>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;density&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.2,&quot;min&quot;:0.3,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Stars&quot;,&quot;unit&quot;:&quot;×&quot;},&quot;twinkleShare&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:0.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Stars&quot;,&quot;unit&quot;:&quot;&quot;},&quot;twinkleSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.1,&quot;min&quot;:0.2,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Stars&quot;,&quot;unit&quot;:&quot;×&quot;},&quot;colorMix&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Warm + white&quot;,&quot;options&quot;:[&quot;White only&quot;,&quot;Warm + white&quot;,&quot;Cool + white&quot;,&quot;White, warm &amp; cool&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stars&quot;},&quot;driftSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:0,&quot;max&quot;:40,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;,&quot;unit&quot;:&quot;px/s&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.containerRef = React.createRef();\n  }\n\n  componentDidMount() {\n    this.setup();\n    this._onResize = () => {\n      clearTimeout(this._rt);\n      this._rt = setTimeout(() => this.setup(), 150);\n    };\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentDidUpdate() {\n    // tweaks changed -> regenerate\n    this.setup();\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    clearTimeout(this._rt);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  // --- helpers -----------------------------------------------------------\n  palette() {\n    const mix = this.props.colorMix ?? 'Warm + white';\n    const WHITE = '255,255,255';\n    const WARM = '255,241,221';\n    const COOL = '209,224,255';\n    if (mix === 'White only') return [WHITE];\n    if (mix === 'Warm + white') return [WHITE, WHITE, WHITE, WARM];\n    if (mix === 'Cool + white') return [WHITE, WHITE, WHITE, COOL];\n    return [WHITE, WHITE, WHITE, WHITE, WARM, COOL]; // mostly white, occasional tint\n  }\n\n  setup() {\n    cancelAnimationFrame(this._raf);\n    const root = this.containerRef.current;\n    if (!root) return;\n    const layer = root.querySelector('#starfield-layer');\n    const cStatic = root.querySelector('[data-layer=\"static\"]');\n    const cTwink = root.querySelector('[data-layer=\"twinkle\"]');\n\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    const w = root.clientWidth || window.innerWidth;\n    const vh = root.clientHeight || window.innerHeight;\n    // Treadmill: the star pattern is one viewport tall, drawn twice stacked,\n    // and the layer scrolls continuously upward, wrapping seamlessly.\n    const H = vh;          // pattern height\n    const h = H * 2;       // physical canvas height (two copies)\n\n    layer.style.height = h + 'px';\n\n    for (const cv of [cStatic, cTwink]) {\n      cv.width = Math.round(w * dpr);\n      cv.height = Math.round(h * dpr);\n      cv.style.width = w + 'px';\n      cv.style.height = h + 'px';\n      const ctx = cv.getContext('2d');\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    }\n    const sctx = cStatic.getContext('2d');\n    const tctx = cTwink.getContext('2d');\n\n    // --- generate stars ---------------------------------------------------\n    const density = this.props.density ?? 1.2;\n    const twinkleShare = this.props.twinkleShare ?? 0.35;\n    const twinkleSpeed = this.props.twinkleSpeed ?? 2.1;\n    const colors = this.palette();\n    const area = w * H;\n    const count = Math.max(1, Math.round((area / 6500) * density));\n\n    const rnd = (a, b) => a + Math.random() * (b - a);\n    const statics = [];\n    const twinklers = [];\n\n    for (let i = 0; i < count; i++) {\n      const x = Math.round(rnd(0, w));\n      const y = Math.round(rnd(0, H));\n      const r = Math.random();\n      // mostly 1px, some 2px, a rare sprinkling of 4-5px\n      const size = r < 0.76 ? 1 : r < 0.965 ? 2 : r < 0.985 ? 4 : 5;\n      const color = colors[(Math.random() * colors.length) | 0];\n      // dimmer base for the small ones, so it reads as depth\n      const base = size === 1 ? rnd(0.30, 0.72) : size === 2 ? rnd(0.55, 0.95) : rnd(0.7, 1);\n\n      if (Math.random() < twinkleShare) {\n        twinklers.push({\n          x, y, size, color,\n          base: rnd(0.35, 0.62),\n          amp: rnd(0.28, 0.55),\n          speed: rnd(0.6, 1.9) * twinkleSpeed,\n          speed2: rnd(0.15, 0.5) * twinkleSpeed,\n          phase: rnd(0, Math.PI * 2),\n        });\n      } else {\n        statics.push({ x, y, size, color, a: base });\n      }\n    }\n\n    // draws a star; big stars (4-5px) get a soft halo\n    const drawStar = (ctx, s, a, y) => {\n      ctx.fillStyle = `rgba(${s.color},${a.toFixed(3)})`;\n      ctx.fillRect(s.x, y, s.size, s.size);\n      if (s.size >= 4) {\n        ctx.fillStyle = `rgba(${s.color},${(a * 0.14).toFixed(3)})`;\n        ctx.fillRect(s.x - 2, y - 2, s.size + 4, s.size + 4);\n      } else if (s.size === 2 && a > 0.75) {\n        ctx.fillStyle = `rgba(${s.color},${(a * 0.16).toFixed(3)})`;\n        ctx.fillRect(s.x - 1, y - 1, 4, 4);\n      }\n    };\n\n    // --- paint the static layer once (two stacked copies for the loop) ----\n    sctx.clearRect(0, 0, w, h);\n    for (const s of statics) {\n      drawStar(sctx, s, s.a, s.y);\n      drawStar(sctx, s, s.a, s.y + H);\n    }\n\n    // --- continuous drift (treadmill, wraps seamlessly) --------------------\n    const driftSpeed = this.props.driftSpeed ?? 10; // px per second, upward\n\n    // --- twinkle + drift loop ----------------------------------------------\n    const t0 = performance.now();\n    const tick = (now) => {\n      const t = (now - t0) / 1000;\n      tctx.clearRect(0, 0, w, h);\n      for (const s of twinklers) {\n        let a = s.base + s.amp * Math.sin(t * s.speed + s.phase)\n                       + (s.amp * 0.35) * Math.sin(t * s.speed2 + s.phase * 1.7);\n        if (a < 0.04) a = 0.04;\n        if (a > 1) a = 1;\n        drawStar(tctx, s, a, s.y);\n        drawStar(tctx, s, a, s.y + H);\n      }\n      const off = (t * driftSpeed) % H;\n      layer.style.transform = `translate3d(0, ${(-off).toFixed(2)}px, 0)`;\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  renderVals() {\n    return { rootRef: this.containerRef };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
